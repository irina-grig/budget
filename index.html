<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Мой Бюджет</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --card: #1a1a24;
    --card2: #22222e;
    --border: #2e2e3e;
    --accent: #7c6cfa;
    --accent2: #a594ff;
    --green: #4ade80;
    --red: #f87171;
    --text: #f0eeff;
    --muted: #8884a8;
    --income: #4ade80;
    --expense: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  .app { max-width: 480px; margin: 0 auto; padding-bottom: 80px; }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    padding: 20px 16px 16px;
    position: sticky; top: 0; z-index: 100;
    border-bottom: 1px solid var(--border);
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .logo { font-family: 'Unbounded', sans-serif; font-size: 16px; color: var(--accent2); letter-spacing: -0.5px; }
  .account-selector {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
  }
  .account-selector::-webkit-scrollbar { display: none; }
  .acc-btn {
    font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 600;
    padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted); cursor: pointer;
    white-space: nowrap; transition: all 0.2s;
  }
  .acc-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* BALANCE CARD */
  .balance-card {
    margin: 12px 16px;
    background: linear-gradient(135deg, #2d2060 0%, #1a1440 100%);
    border-radius: 16px; padding: 20px;
    border: 1px solid rgba(124,108,250,0.3);
  }
  .balance-label { font-size: 11px; color: var(--accent2); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
  .balance-amount { font-family: 'Unbounded', sans-serif; font-size: 28px; font-weight: 700; }
  .balance-amount.pos { color: var(--green); }
  .balance-amount.neg { color: var(--red); }
  .balance-stats { display: flex; gap: 20px; margin-top: 14px; }
  .stat { flex: 1; }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
  .stat-val { font-size: 13px; font-weight: 600; }
  .stat-val.inc { color: var(--green); }
  .stat-val.exp { color: var(--red); }

  /* TABS */
  .tabs { display: flex; margin: 0 16px 12px; background: var(--card); border-radius: 10px; padding: 3px; }
  .tab { flex: 1; text-align: center; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); transition: all 0.2s; }
  .tab.active { background: var(--accent); color: white; }

  /* FILTER ROW */
  .filter-row { display: flex; gap: 8px; margin: 0 16px 12px; overflow-x: auto; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    cursor: pointer; white-space: nowrap; transition: all 0.2s;
  }
  .filter-chip.active { border-color: var(--accent); color: var(--accent); }

  /* TRANSACTIONS */
  .section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; padding: 8px 16px 6px; }
  .tx-list { padding: 0 16px; }
  .tx-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--border);
    animation: fadeIn 0.3s ease;
  }
  .tx-item:last-child { border-bottom: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity:1; transform: translateY(0); } }
  .tx-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .tx-icon.inc { background: rgba(74,222,128,0.15); }
  .tx-icon.exp { background: rgba(248,113,113,0.15); }
  .tx-info { flex: 1; min-width: 0; }
  .tx-cat { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .tx-amount { font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .tx-amount.inc { color: var(--green); }
  .tx-amount.exp { color: var(--red); }

  /* ADD FORM */
  .add-form {
    margin: 0 16px; background: var(--card); border-radius: 16px;
    padding: 16px; border: 1px solid var(--border);
  }
  .form-title { font-family: 'Unbounded', sans-serif; font-size: 13px; margin-bottom: 14px; color: var(--accent2); }
  .form-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .form-row.col { flex-direction: column; }
  .type-btn {
    flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card2); color: var(--muted); font-weight: 600; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
  }
  .type-btn.income.active { background: rgba(74,222,128,0.2); border-color: var(--green); color: var(--green); }
  .type-btn.expense.active { background: rgba(248,113,113,0.2); border-color: var(--red); color: var(--red); }
  .form-input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card2);
    color: var(--text); font-family: 'Manrope', sans-serif; font-size: 14px;
    outline: none; transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--muted); }
  select.form-input option { background: var(--card2); }
  .submit-btn {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: var(--accent); color: white; font-family: 'Unbounded', sans-serif;
    font-size: 13px; cursor: pointer; transition: opacity 0.2s; margin-top: 4px;
  }
  .submit-btn:active { opacity: 0.8; }

  /* CATEGORIES VIEW */
  .cat-list { padding: 0 16px; }
  .cat-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 0; border-bottom: 1px solid var(--border);
  }
  .cat-name { font-size: 13px; font-weight: 600; }
  .cat-amount { font-size: 13px; font-weight: 700; }
  .cat-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; }
  .cat-bar { height: 4px; border-radius: 2px; transition: width 0.4s ease; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; padding: 8px 0 12px;
  }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px; color: var(--muted); transition: color 0.2s; border: none; background: none; }
  .nav-btn.active { color: var(--accent2); }
  .nav-icon { font-size: 22px; line-height: 1; }
  .nav-label { font-size: 10px; font-weight: 600; }

  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 10px; }

  .load-more { display: block; margin: 12px 16px; padding: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-size: 12px; font-weight: 600; text-align: center; cursor: pointer; width: calc(100% - 32px); }

  .del-btn { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px 6px; border-radius: 6px; flex-shrink: 0; transition: color 0.2s; }
  .del-btn:active { color: var(--red); }

  .backup-btn { display: block; margin: 8px 16px; padding: 10px; background: var(--card); border: 1px solid var(--accent); border-radius: 10px; color: var(--accent2); font-size: 12px; font-weight: 600; text-align: center; cursor: pointer; width: calc(100% - 32px); }

  .add-acc-row { display: flex; gap: 8px; margin: 8px 16px 0; }
  .add-acc-input { flex: 1; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-family: 'Manrope', sans-serif; font-size: 13px; outline: none; }
  .add-acc-input:focus { border-color: var(--accent); }
  .add-acc-btn { padding: 8px 14px; border-radius: 10px; border: none; background: var(--accent); color: white; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
</style>
</head>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div class="logo">💰 Мій Бюджет</div>
    </div>

    <div class="add-acc-row">

  <!-- CONTENT -->
  <div id="mainContent"></div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">

      <span class="nav-icon">➕</span>
      <span class="nav-label">Додати</span>
    </button>
  </div>
</div>

let transactions = JSON.parse(localStorage.getItem('budget_tx') || 'null') || [...IMPORTED];
let nextId = Math.max(...transactions.map(t=>t.id)) + 1;
let currentAccount = 'all';
let currentView = 'history';
let filterType = 'all';
let showCount = 40;

let ACCOUNTS = JSON.parse(localStorage.getItem('budget_accounts') || 'null') || ['Мы 24', 'Мы 25', 'Мы 26'];

function save() {
  try {
    localStorage.setItem('budget_tx', JSON.stringify(transactions));
    localStorage.setItem('budget_accounts', JSON.stringify(ACCOUNTS));
  } catch(e) {}
}

function addAccount() {
  const input = document.getElementById('newAccInput');
  const name = input.value.trim();
  if (!name) { alert('Введіть назву рахунку'); return; }
  if (ACCOUNTS.includes(name)) { alert('Такий рахунок вже є'); return; }
  ACCOUNTS.push(name);
  save();
  input.value = '';
  renderAccountSelector();
}

function deleteTx(id) {
  if (!confirm('Видалити цю операцію?')) return;
  transactions = transactions.filter(t => t.id !== id);
  save();
  renderMain();
}

function downloadBackup() {
  const data = JSON.stringify({ transactions, accounts: ACCOUNTS }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'budget_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function downloadExcel() {
  const list = currentAccount === 'all' ? transactions : transactions.filter(t => t.account === currentAccount);
  const sorted = list.slice().sort((a,b) => b.date.localeCompare(a.date));
  
  // Build CSV with BOM for Excel UTF-8
  let csv = '\uFEFF';
  csv += 'Дата;Категорія;Рахунок;Сума;Валюта;Тип\n';
  sorted.forEach(t => {
    const type = t.amount > 0 ? 'Надходження' : 'Витрата';
    const amt = Math.abs(t.amount);
    csv += `${t.date};${t.category || ''};${t.account};${amt};${t.currency};${type}\n`;
  });
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const accName = currentAccount === 'all' ? 'all' : currentAccount.replace(' ', '_');
  a.download = 'budget_' + accName + '_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function fmt(n, currency) {
  const sym = currency === 'USD' ? '$' : currency === 'EUR' ? '€' : '₴';
  return Math.abs(n).toLocaleString('ru') + ' ' + sym;
}

function fmtDate(d) {
  const parts = d.split('-');
  return parts[2] + '.' + parts[1] + '.' + parts[0].slice(2);
}

function getCatIcon(cat, isIncome) {
  if (isIncome) return '💰';
  const c = cat.toLowerCase();
  if (c.includes('дом')) return '🏠';
  if (c.includes('дети') || c.includes('спорт')) return '⚽';
  if (c.includes('налог')) return '📋';
  if (c.includes('отпуск')) return '✈️';
  if (c.includes('зп') || c.includes('сайт')) return '💻';
  if (c.includes('папа') || c.includes('мама')) return '👨‍👩';
  if (c.includes('евро') || c.includes('валют')) return '💱';
  if (c.includes('кредит')) return '🏦';
  if (c.includes('турнир')) return '🏆';
  return '📌';
}

function filteredTx() {
  let list = transactions;
  if (currentAccount !== 'all') list = list.filter(t => t.account === currentAccount);
  if (filterType === 'income') list = list.filter(t => t.amount > 0);
  if (filterType === 'expense') list = list.filter(t => t.amount < 0);
  if (searchQuery) list = list.filter(t => (t.category||'').toLowerCase().includes(searchQuery.toLowerCase()));
  if (sortOrder === 'newest') list = list.slice().sort((a,b) => b.date.localeCompare(a.date));
  else if (sortOrder === 'oldest') list = list.slice().sort((a,b) => a.date.localeCompare(b.date));
  else if (sortOrder === 'biggest') list = list.slice().sort((a,b) => Math.abs(b.amount) - Math.abs(a.amount));
  else if (sortOrder === 'smallest') list = list.slice().sort((a,b) => Math.abs(a.amount) - Math.abs(b.amount));
  return list;
}

function getStats(list) {
  const income = list.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const expense = list.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  return { income, expense, balance: income - expense };
}

// ---- RENDER ----
function renderAccountSelector() {
  const el = document.getElementById('accountSelector');
  const btns = [{ id:'all', label:'Всі рахунки' }, ...ACCOUNTS.map(a=>({id:a,label:a}))];
  el.innerHTML = btns.map(b => `<button class="acc-btn ${currentAccount===b.id?'active':''}" onclick="selectAccount('${b.id}')">${b.label}</button>`).join('');
}

function renderHistory() {
  const list = filteredTx();
  const stats = getStats(transactions.filter(t => currentAccount==='all' || t.account===currentAccount));
  const balClass = stats.balance >= 0 ? 'pos' : 'neg';

  let html = `
    <div class="balance-card">
      <div class="balance-label">Баланс · ${currentAccount==='all'?'Всі рахунки':currentAccount}</div>
      <div class="balance-amount ${balClass}">${stats.balance>=0?'+':'−'} ${fmt(stats.balance)}</div>
      <div class="balance-stats">
        <div class="stat"><div class="stat-label">Надходження</div><div class="stat-val inc">+${fmt(stats.income)}</div></div>
        <div class="stat"><div class="stat-label">Витрати</div><div class="stat-val exp">−${fmt(stats.expense)}</div></div>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-chip ${filterType==='all'?'active':''}" onclick="setFilter('all')">Всі</div>
      <div class="filter-chip ${filterType==='income'?'active':''}" onclick="setFilter('income')">Надходження</div>
      <div class="filter-chip ${filterType==='expense'?'active':''}" onclick="setFilter('expense')">Витрати</div>
    </div>
    <div style="padding:0 16px 10px;display:flex;gap:8px;">
      <input style="flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-family:Manrope,sans-serif;font-size:13px;outline:none;" 
        placeholder="🔍 Пошук по категорії..." 
        value="${searchQuery}"
        oninput="setSearch(this.value)">
      <select style="padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:12px;outline:none;cursor:pointer;"
        onchange="setSort(this.value)">
        <option value="newest" ${sortOrder==='newest'?'selected':''}>Нові ↑</option>
        <option value="oldest" ${sortOrder==='oldest'?'selected':''}>Старі ↑</option>
        <option value="biggest" ${sortOrder==='biggest'?'selected':''}>Більші ↑</option>
        <option value="smallest" ${sortOrder==='smallest'?'selected':''}>Менші ↑</option>
      </select>
    </div>
    <div class="section-title">${list.length} операцій</div>
    <div class="tx-list">`;

  const shown = list.slice(0, showCount);
  shown.forEach(t => {
    const isInc = t.amount > 0;
    const icon = getCatIcon(t.category, isInc);
    html += `<div class="tx-item">
      <div class="tx-icon ${isInc?'inc':'exp'}">${icon}</div>
      <div class="tx-info">
        <div class="tx-cat">${t.category || '(без категорії)'}</div>
        <div class="tx-date">${fmtDate(t.date)} · ${t.account}</div>
      </div>
      <div class="tx-amount ${isInc?'inc':'exp'}">${isInc?'+':'−'}${fmt(t.amount, t.currency)}</div>
      <button class="del-btn" onclick="deleteTx(${t.id})" title="Видалити">🗑</button>
    </div>`;
  });

  html += `</div>`;
  if (shown.length < list.length) {
    html += `<button class="load-more" onclick="loadMore()">Показати ще (залишилось ${list.length - shown.length})</button>`;
  }
  html += `<button class="backup-btn" onclick="downloadBackup()">💾 Резервна копія (JSON)</button><button class="backup-btn" style="border-color:var(--green);color:var(--green);margin-top:4px" onclick="downloadExcel()">📊 Скачати в Excel (CSV)</button>`;
  return html;
}

function renderStats() {
  const base = currentAccount==='all' ? transactions : transactions.filter(t=>t.account===currentAccount);
  const catMap = {};
  base.filter(t=>t.amount<0).forEach(t => {
    const k = t.category || '(без категорії)';
    catMap[k] = (catMap[k]||0) + Math.abs(t.amount);
  });
  const cats = Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,20);
  const maxVal = cats[0]?.[1] || 1;
  const stats = getStats(base);

  let html = `
    <div class="balance-card">
      <div class="balance-label">Підсумок · ${currentAccount==='all'?'Всі рахунки':currentAccount}</div>
      <div class="balance-amount ${stats.balance>=0?'pos':'neg'}">${stats.balance>=0?'+':'−'} ${fmt(stats.balance)}</div>
      <div class="balance-stats">
        <div class="stat"><div class="stat-label">Надходження</div><div class="stat-val inc">+${fmt(stats.income)}</div></div>
        <div class="stat"><div class="stat-label">Витрати</div><div class="stat-val exp">−${fmt(stats.expense)}</div></div>
      </div>
    </div>
    <div class="section-title">Топ витрат по категоріях</div>
    <div class="cat-list">`;

  cats.forEach(([name, val]) => {
    const pct = Math.round(val/maxVal*100);
    const color = '#f87171';
    html += `<div class="cat-item">
      <div style="flex:1;min-width:0">
        <div class="cat-name">${name}</div>
        <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%;background:${color}"></div></div>
      </div>
      <div class="cat-amount exp" style="margin-left:12px">−${fmt(val)}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderAdd() {
  const cats = [...new Set(transactions.map(t=>t.category).filter(Boolean))].sort();
  const accOptions = ACCOUNTS.map(a=>`<option value="${a}">${a}</option>`).join('');
  const catOptions = cats.map(c=>`<option value="${c}">${c}</option>`).join('');

  return `
    <div class="add-form">
      <div class="form-title">Нова операція</div>
      <div class="form-row">
        <button class="type-btn income active" id="btnIncome" onclick="setType('income')">+ Надходження</button>
        <button class="type-btn expense" id="btnExpense" onclick="setType('expense')">− Витрата</button>
      </div>
      <div class="form-row">
        <input class="form-input" id="fAmount" type="number" placeholder="Сума (₴)" inputmode="decimal" style="flex:1">
      </div>
      <div class="form-row">
        <input class="form-input" id="fCatNew" type="text" placeholder="Категорія (нова або з списку)" list="catlist" style="flex:1">
        <datalist id="catlist">${catOptions}</datalist>
      </div>
      <div class="form-row">
        <input class="form-input" id="fDate" type="date" value="${new Date().toISOString().slice(0,10)}" style="flex:1">
      </div>
      <div class="form-row">
        <select class="form-input" id="fAccount" style="flex:1">${accOptions}</select>
        <select class="form-input" id="fCurrency" style="width:90px">
          <option value="UAH">₴ UAH</option>
          <option value="USD">$ USD</option>
          <option value="EUR">€ EUR</option>
        </select>
      </div>
      <button class="submit-btn" onclick="addTx()">Додати</button>
    </div>`;
}

let addType = 'income';
let searchQuery = '';
let sortOrder = 'newest';
function setType(t) {
  addType = t;
  document.getElementById('btnIncome').className = 'type-btn income' + (t==='income'?' active':'');
  document.getElementById('btnExpense').className = 'type-btn expense' + (t==='expense'?' active':'');
}

function addTx() {
  const amount = parseFloat(document.getElementById('fAmount').value);
  const cat = document.getElementById('fCatNew').value.trim();
  const date = document.getElementById('fDate').value;
  const account = document.getElementById('fAccount').value;

  if (!amount || amount <= 0) { alert('Введіть суму'); return; }
  if (!date) { alert('Введіть дату'); return; }

  const currency = document.getElementById('fCurrency').value;
  const finalAmount = addType === 'income' ? amount : -amount;
  transactions.unshift({ id: nextId++, date, category: cat || '(без категорії)', account, amount: finalAmount, currency });
  save();
  switchView('history');
}

function loadMore() {
  showCount += 40;
  renderMain();
}

function setSearch(q) {
  searchQuery = q;
  showCount = 40;
  renderMain();
}

function setSort(s) {
  sortOrder = s;
  showCount = 40;
  renderMain();
}

function setFilter(f) {
  filterType = f;
  showCount = 40;
  renderMain();
}

function selectAccount(acc) {
  currentAccount = acc;
  showCount = 40;
  renderAccountSelector();
  renderMain();
}

function switchView(v) {
  currentView = v;
  showCount = 40;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav' + v.charAt(0).toUpperCase() + v.slice(1)).classList.add('active');
  renderMain();
}

function renderMain() {
  const el = document.getElementById('mainContent');
  if (currentView === 'history') el.innerHTML = renderHistory();
  else if (currentView === 'stats') el.innerHTML = renderStats();
  else el.innerHTML = renderAdd();
}

// INIT
renderAccountSelector();
renderMain();
</script>
</body>
</html>
